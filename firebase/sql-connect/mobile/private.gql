# Private rows carry ownerUid as a denormalized authorization boundary. The
# relational organization IDs remain the business boundary for joins.

query MyOrganizations @auth(level: USER) {
  organizations(where: {ownerUid: {eq_expr: "auth.uid"}, deletedAt: {isNull: true}}) {
    id name revision createdAt updatedAt
  }
}

query MyChickenHouses @auth(level: USER) {
  chickenHouses(where: {ownerUid: {eq_expr: "auth.uid"}, deletedAt: {isNull: true}}, orderBy: {name: ASC}) {
    id organizationId name capacity occupancy houseType revision createdAt updatedAt
  }
}

mutation CreateOrganization($id: UUID!, $name: String!) @auth(level: USER) @transaction {
  organization_insert(data: {id: $id, ownerUid_expr: "auth.uid", name: $name})
  organizationMembership_insert(data: {organizationId: $id, userUid_expr: "auth.uid", role: "owner", active: true})
}

mutation CreateChickenHouse($id: UUID!, $organizationId: UUID!, $name: String!, $capacity: Int!, $occupancy: Int!, $houseType: String!) @auth(level: USER) @transaction {
  query @redact @check(expr: "response.query.organizationMemberships.size() == 1", message: "Active owner membership is required.") {
    organizationMemberships(where: {organizationId: {eq: $organizationId}, userUid: {eq_expr: "auth.uid"}, role: {eq: "owner"}, active: {eq: true}}, limit: 1) { organizationId }
  }
  chickenHouse_insert(data: {
    id: $id
    organizationId: $organizationId
    ownerUid_expr: "auth.uid"
    name: $name
    capacity: $capacity
    occupancy: $occupancy
    houseType: $houseType
  })
}

mutation UpdateChickenHouse($id: UUID!, $expectedRevision: Int!, $name: String!, $capacity: Int!, $occupancy: Int!, $houseType: String!) @auth(level: USER) @transaction {
  query @redact @check(expr: "response.query.chickenHouses.size() == 1", message: "House is missing, stale, or belongs to another user.") {
    chickenHouses(where: {id: {eq: $id}, ownerUid: {eq_expr: "auth.uid"}, revision: {eq: $expectedRevision}, deletedAt: {isNull: true}}, limit: 1) { id }
  }
  chickenHouse_update(id: $id, data: {
    name: $name
    capacity: $capacity
    occupancy: $occupancy
    houseType: $houseType
    revision_update: {inc: 1}
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "House update did not modify a record.")
}

# Financial confirmation and reversal are intentionally not available to a
# mobile connector. They are server-only transactional operations.
query FinancialRecordsServerOnly @auth(level: NO_ACCESS) {
  distributionRecords(limit: 1) { id status revision }
}
